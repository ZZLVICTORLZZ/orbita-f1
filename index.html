<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órbita F1 - Rol Local</title>
    <style>
        /* =========================================
           PALETAS DE COLORES (Minimalistas)
           ========================================= */

        :root {
            /* Tema 1: Claro / Pop Rock (☀️) */
            --bg-main: #fcfcfc;
            --text-main: #222222;
            --title-color: #d1124d; 
            --btn-plus-bg: #4ae256; 
            --btn-minus-bg: #d1124d; 
            --btn-submit-bg: #d1124d;
            --border-color: #dddddd;
            --border-width: 1px;
            --button-radius: 8px;
            --font-family-global: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body.theme-steampunk {
            /* Tema 2: Steampunk / Neón (🪐) */
            --bg-main: #1a1511; 
            --text-main: #e8c396; 
            --title-color: #3aeaff; 
            --btn-plus-bg: #3aeaff; 
            --btn-minus-bg: #ff00ff; 
            --btn-submit-bg: #3aeaff;
            --border-color: #4a3827; 
            --border-width: 1px;
            --button-radius: 8px;
        }

        body.theme-gothic {
            /* Tema 3: Oscuro / Gótico (🌙) */
            --bg-main: #0a0a0a; 
            --text-main: #d4d4d4; 
            --title-color: #8c0a1a; 
            --btn-plus-bg: #8c0a1a; 
            --btn-minus-bg: #600711; 
            --btn-submit-bg: #8c0a1a;
            --border-color: #333333; 
            --border-width: 1px; 
            --button-radius: 4px;
        }

        /* =========================================
           ESTILOS GENERALES Y LAYOUT
           ========================================= */

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: var(--font-family-global);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1, h2, h3 {
            color: var(--title-color);
            margin: 10px 0;
            font-weight: 600;
        }

        /* Barra Superior (Top Bar) */
        header {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-width) solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--title-color);
            margin: 0;
        }

        .header-icons {
            display: flex;
            gap: 15px;
            font-size: 1.4rem;
        }

        .icon-btn {
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        
        .icon-btn:active {
            transform: scale(0.9);
        }

        /* Pantallas (Views) */
        .app-view {
            display: none;
            width: 100%;
            max-width: 480px;
            flex-direction: column;
            gap: 15px;
        }

        .app-view.active {
            display: flex;
        }

        /* Componentes Comunes */
        .card {
            background-color: transparent;
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--button-radius);
            padding: 15px;
            box-sizing: border-box;
        }

        input, textarea {
            background-color: transparent;
            color: var(--text-main);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--button-radius);
            padding: 12px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            font-family: var(--font-family-global);
            margin-bottom: 10px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--title-color);
        }

        /* Botones de Acción MÓVIL */
        .btn {
            border: none;
            border-radius: var(--button-radius);
            font-family: var(--font-family-global);
            font-size: 1.1rem;
            font-weight: 600;
            padding: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
            width: 100%;
            box-sizing: border-box;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-green {
            background-color: var(--btn-plus-bg);
            color: #ffffff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .btn-cherry {
            background-color: var(--btn-submit-bg);
            color: #ffffff;
        }

        .btn-outline {
            background-color: transparent;
            border: var(--border-width) solid var(--border-color);
            color: var(--text-main);
        }

        /* =========================================
           UI SELECCIÓN DE RUTA (FULL SCREEN)
           ========================================= */
        #route-full-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* =========================================
           LÓGICA DEL CONTADOR AJUSTADO (MÓVIL)
           ========================================= */
        #counter-value {
            font-size: 7rem;
            font-weight: bold;
            color: var(--title-color);
            margin: 5px 0;
            text-align: center;
        }

        #counter-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        #btn-plus {
            font-size: 3rem;
            border-radius: var(--button-radius);
            width: 80%;
            padding: 20px 0;
        }

        #btn-minus {
            font-size: 2rem;
            border-radius: 12px;
            width: 60px;
            height: 60px;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #counter-cash {
            border: var(--border-width) solid var(--border-color);
            color: var(--text-main);
            font-weight: bold;
            padding: 12px;
            text-align: center;
            border-radius: var(--button-radius);
            margin-top: 15px;
        }

        /* =========================================
           SECCIONES DEL HOME
           ========================================= */
        .merged-section {
            margin-bottom: 20px;
        }

        .corte-item {
            display: flex;
            justify-content: space-between;
            border-bottom: var(--border-width) solid var(--border-color);
            padding: 10px 0;
            font-size: 0.95rem;
        }

        .history-item-home {
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--button-radius);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .history-controls {
            display: flex;
            gap: 15px;
            font-size: 1.3rem;
        }

    </style>
</head>
<body id="app-body">

    <header>
        <div class="header-title">Órbita F1</div>
        <div class="header-icons">
            <span class="icon-btn" onclick="setTheme('default')" title="Tema Claro">☀️</span>
            <span class="icon-btn" onclick="setTheme('theme-steampunk')" title="Tema Steampunk">🪐</span>
            <span class="icon-btn" onclick="setTheme('theme-gothic')" title="Tema Gótico">🌙</span>
            <span class="icon-btn" onclick="showScreen('view-registration')" title="Configuración">⚙️</span>
        </div>
    </header>

    <div id="view-home" class="app-view active">
        
        <div class="merged-section" style="text-align: center;">
            <p style="margin: 0; color: var(--text-main); font-size: 0.9rem;">Efectivo acumulado hoy</p>
            <div id="balance-total-cash" style="font-size: 3rem; font-weight: bold; color: var(--title-color);">$0</div>
        </div>

        <div class="merged-section">
            <button class="btn btn-cherry" onclick="showScreen('view-route-full')">GENERAR VUELTA</button>
        </div>

        <div class="merged-section card">
            <h2 style="margin-top:0; font-size: 1.1rem;">Liquidación del Turno</h2>
            <div class="corte-item"><span>Vueltas Totales:</span><b id="corte-vueltas-count">0</b></div>
            <div class="corte-item"><span>Ingreso Bruto:</span><b id="corte-bruto">$0</b></div>
            <div class="corte-item"><span>Sueldo Operador:</span><b>-$650</b></div>
            
            <div style="margin-top: 15px;">
                <input type="number" id="corte-gasto-extra" placeholder="Monto extra (ej. 150)" oninput="updateMergedView()">
                <input type="text" id="corte-gasto-concepto" placeholder="Concepto del gasto (ej. Talacha)">
                <textarea id="corte-obs" placeholder="Observaciones (tráfico, novedades...)"></textarea>
            </div>

            <div style="margin-top: 15px; text-align: center; padding-top: 15px; border-top: var(--border-width) solid var(--border-color);">
                <span style="font-size: 0.9rem;">A ENTREGAR</span>
                <div id="corte-final" style="font-size: 2.2rem; font-weight: bold; color: var(--title-color);">$0</div>
            </div>

            <button class="btn btn-outline" style="margin-top: 15px;" onclick="enviarReporteCorteWA()">ENVIAR CORTE</button>
        </div>

        <div class="merged-section">
            <h2 style="font-size: 1.1rem;">Historial de Vueltas</h2>
            <div id="history-list-home">
                </div>
        </div>

    </div>

    <div id="view-route-full" class="app-view">
        <h2 style="text-align: center; margin-bottom: 20px;">Destino</h2>
        <div id="route-full-buttons">
            <button class="btn btn-outline" onclick="generateVuelta('Huehuetoca')">HUEHUETOCA ($15)</button>
            <button class="btn btn-outline" onclick="generateVuelta('Lazaro Cardenas')">LÁZARO CÁRDENAS ($14)</button>
            <button class="btn btn-outline" onclick="generateVuelta('Colorado')">COLORADO ($14)</button>
            <button class="btn btn-outline" onclick="generateVuelta('Compadres')">COMPADRES ($14)</button>
            <button class="btn btn-outline" onclick="generateVuelta('Tetecla')">TETECLA ($14)</button>
            <button class="btn btn-outline" onclick="generateVuelta('Pendiente 1')">PENDIENTE 1 ($14)</button>
            <button class="btn btn-outline" onclick="generateVuelta('Pendiente 2')">PENDIENTE 2 ($14)</button>
        </div>
        <button class="btn btn-cherry" style="margin-top: 20px;" onclick="showScreen('view-home')">CANCELAR</button>
    </div>

    <div id="view-vueltas" class="app-view">
        <div id="route-display" style="text-align: center; font-weight: bold; font-size: 1.2rem; margin-bottom: 10px; color: var(--title-color);">[Ruta]</div>
        
        <div style="text-align: center; font-size: 0.9rem; letter-spacing: 1px;">PASAJEROS</div>
        <div id="counter-value">0</div>
        
        <div id="counter-controls">
            <button id="btn-plus" class="btn btn-green" onclick="incrementCounter()">+</button>
            <button id="btn-minus" class="btn btn-cherry" onclick="decrementCounter()">-</button>
        </div>
        
        <div id="counter-cash">TOTAL: $0</div>

        <button class="btn btn-cherry" style="margin-top:25px;" onclick="closeVuelta()">CERRAR VUELTA</button>
    </div>

    <div id="view-cierre" class="app-view card">
        <h2 style="text-align: center;">Resumen</h2>
        <div id="cierre-details" style="font-size: 1.1rem; line-height: 1.6; margin-bottom: 20px; text-align: center;">...</div>
        <button class="btn btn-green" style="margin-bottom: 10px;" onclick="enviarReporteVueltaWA()">ENVIAR VUELTA</button>
        <button class="btn btn-outline" onclick="showScreen('view-home')">VOLVER AL HOME</button>
    </div>

    <div id="view-registration" class="app-view card">
        <h2 style="margin-top: 0;">Configuración</h2>
        <p style="font-size: 0.9rem;">Datos fijos para reportes de WhatsApp:</p>
        <input type="text" id="reg-operador" placeholder="Operador (ej. Carlos)" value="Carlos">
        <input type="number" id="reg-unidad" placeholder="Unidad (ej. 15)" value="15">
        <button class="btn btn-cherry" style="margin-top: 15px;" onclick="showScreen('view-home')">GUARDAR</button>
    </div>

    <script>
        const rates = {
            "Huehuetoca": 15, "Lazaro Cardenas": 14, "Colorado": 14,
            "Compadres": 14, "Tetecla": 14, "Pendiente 1": 14, "Pendiente 2": 14
        };
        const sueldoFijo = 650;

        let currentVuelta = null;
        let vueltasHistory = [];
        let totalDayCashAccumulated = 0;

        function showScreen(screenId) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            if (screenId === 'view-home') updateMergedView();
        }

        function setTheme(theme) {
            document.getElementById('app-body').className = theme === 'default' ? '' : theme;
        }

        function generateVuelta(route) {
            currentVuelta = {
                id: Date.now(), route: route, rate: rates[route],
                startTime: new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }),
                passengers: 0, cash: 0
            };
            document.getElementById('route-display').innerText = `${currentVuelta.route} ($${currentVuelta.rate})`;
            updateVueltaDisplay();
            showScreen('view-vueltas');
        }

        function incrementCounter() {
            currentVuelta.passengers++;
            updateVueltaDisplay();
        }

        function decrementCounter() {
            if (currentVuelta.passengers > 0) currentVuelta.passengers--;
            updateVueltaDisplay();
        }

        function updateVueltaDisplay() {
            currentVuelta.cash = currentVuelta.passengers * currentVuelta.rate;
            document.getElementById('counter-value').innerText = currentVuelta.passengers;
            document.getElementById('counter-cash').innerText = `TOTAL: $${currentVuelta.cash}`;
        }

        function closeVuelta() {
            currentVuelta.endTime = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
            vueltasHistory.push(currentVuelta);
            totalDayCashAccumulated += currentVuelta.cash;
            
            document.getElementById('cierre-details').innerHTML = `
                <b>${currentVuelta.route}</b><br>
                ${currentVuelta.startTime} - ${currentVuelta.endTime}<br>
                ${currentVuelta.passengers} pasajeros<br>
                <b>$${currentVuelta.cash}</b>
            `;
            showScreen('view-cierre');
        }

        function updateMergedView() {
            document.getElementById('balance-total-cash').innerText = `$${totalDayCashAccumulated}`;
            document.getElementById('corte-vueltas-count').innerText = vueltasHistory.length;
            document.getElementById('corte-bruto').innerText = `$${totalDayCashAccumulated}`;
            
            const gastoExtra = parseInt(document.getElementById('corte-gasto-extra').value) || 0;
            document.getElementById('corte-final').innerText = `$${totalDayCashAccumulated - sueldoFijo - gastoExtra}`;

            const list = document.getElementById('history-list-home');
            list.innerHTML = '';
            vueltasHistory.forEach(vuelta => {
                const item = document.createElement('div');
                item.className = 'history-item-home';
                item.innerHTML = `
                    <div>
                        <b>${vuelta.route}</b> (P:${vuelta.passengers})<br>
                        <span style="font-size:0.8rem;">${vuelta.startTime} | $${vuelta.cash}</span>
                    </div>
                    <div class="history-controls">
                        <span style="cursor:pointer;" onclick="editVuelta(${vuelta.id})">🔍</span>
                        <span style="cursor:pointer;" onclick="enviarReporteVueltaWA(${vuelta.id})">📲</span>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function editVuelta(vueltaId) {
            const vuelta = vueltasHistory.find(v => v.id === vueltaId);
            const nuevos = prompt(`Pasajeros en ${vuelta.route}:`, vuelta.passengers);
            if (nuevos !== null && !isNaN(nuevos)) {
                totalDayCashAccumulated -= vuelta.cash;
                vuelta.passengers = parseInt(nuevos);
                vuelta.cash = vuelta.passengers * vuelta.rate;
                totalDayCashAccumulated += vuelta.cash;
                updateMergedView();
            }
        }

        function enviarReporteVueltaWA(vueltaId) {
            const data = (vueltaId) ? vueltasHistory.find(v => v.id === vueltaId) : currentVuelta;
            const text = encodeURIComponent(`*ÓRBITA F1 - REPORTE DE VUELTA*
*Unidad:* ${document.getElementById('reg-unidad').value} | *Operador:* ${document.getElementById('reg-operador').value}
*Ruta:* ${data.route}
*Inicio:* ${data.startTime} | *Fin:* ${data.endTime}
*Pasajeros:* ${data.passengers}
*Efectivo:* $${data.cash}`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }

        function enviarReporteCorteWA() {
            const gastoEx = parseInt(document.getElementById('corte-gasto-extra').value) || 0;
            const conc = document.getElementById('corte-gasto-concepto').value || 'Gasto no detallado';
            const obs = document.getElementById('corte-obs').value || 'Sin novedades';
            
            const text = encodeURIComponent(`*ÓRBITA F1 - CORTE DEL DÍA*
*Unidad:* ${document.getElementById('reg-unidad').value} | *Operador:* ${document.getElementById('reg-operador').value}
*Vueltas Totales:* ${vueltasHistory.length}
*Ingreso Bruto:* $${totalDayCashAccumulated}
*Sueldo:* -$650
*Gasto Extra:* -$${gastoEx} (${conc})
*A ENTREGAR:* $${totalDayCashAccumulated - sueldoFijo - gastoEx}
*Observaciones:* ${obs}`);
            window.open(`https://wa.me/?text=${text}`, '_blank');
        }
    </script>
</body>
</html>
